name: Encrypted VereinsKassa backup bridge
on:
  push:
    paths:
      - '.github/workflows/backup-bridge.yml'

permissions:
  contents: read
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export encrypted archive using GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vereinskassa-backup")
          TOKEN=$(printf '%s' "$OIDC_JSON" | jq -r '.value')
          test -n "$TOKEN" && test "$TOKEN" != "null"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${TOKEN}" \
            'https://joqolbaxxqgcyrcytkbj.supabase.co/functions/v1/vereinskassa-backup-export' \
            --output VereinsKassa_Backup_2026-11-21.zip.enc
          test -s VereinsKassa_Backup_2026-11-21.zip.enc
      - name: Upload short-lived encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: vereinskassa-backup-encrypted-2026-11-21
          path: VereinsKassa_Backup_2026-11-21.zip.enc
          if-no-files-found: error
          retention-days: 1
